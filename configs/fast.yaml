# Profile "fast" — chỉ dùng cho LƯỢT 2-3 Speed Track, SAU KHI lượt 1 đã có điểm.
# Chỉ ghi đè phần khác với default.yaml; nạp bằng:
#   cli ... --config configs/default.yaml --override configs/fast.yaml
#
# KHÔNG dùng profile này cho Smart City: ở đó thời gian chỉ đáng 0.1 điểm/giây
# trong khi đọc sai 1 biển mất ~10 điểm (BASELINE.md §1.3).

control:
  # Mô hình hai mức ga (xem control/corner.py). Lượt nhanh đẩy ga ĐOẠN THẲNG lên,
  # KHÔNG đẩy ga trong cua: cua của sa bàn rất hẹp, vào nhanh là văng khỏi vạch.
  v_straight: 0.42         # giá trị thật phải lấy từ thí nghiệm E3, không đoán
  v_corner: 0.16
  v_max: 0.50              # trần an toàn, nâng theo v_straight
  v_min: 0.14
  # Vào cua nhanh hơn thì phải nhận ra cua SỚM hơn -> hạ ngưỡng vào.
  curve_enter: 0.20
  curve_exit: 0.12
  curve_feedforward: 1.1   # tốc độ cao cần đánh lái sớm hơn nữa
  corner_steer_gain: 1.7
  throttle_fall_rate: 4.0  # bỏ ga dứt khoát hơn khi thấy cua
  slowdown: 0.18           # phanh mạnh hơn ở cua vì vào cua nhanh hơn
  pid:
    kp: 0.72
    ki: 0.00
    kd: 0.16               # tăng D để bù dao động ở tốc độ cao

lane:
  smooth_alpha: 0.5        # bám nhanh hơn, chấp nhận nhiễu hơn

pipeline:
  detect_hz: 8             # Speed Track ít phụ thuộc detector -> nhường CPU cho vòng chính
