# Profile "safe" — dùng cho LƯỢT 1 của cả hai bài.
# Mục tiêu duy nhất: về đích, 0 lỗi. Có điểm rồi mới tăng tốc ở lượt 2-3 (configs/fast.yaml).
# Lý do: 1 lần lệch lane = -13 điểm = 65 giây chạy chậm (xem BASELINE.md §1.2).

camera:
  width: 640
  height: 480
  fps: 30
  # IMX219 khong co sensor mode 640x480. Argus capture o mode 1280x720,
  # sau do nvvidconv resize ve width/height phia tren cho pipeline AI.
  capture_width: 1280
  capture_height: 720
  sensor_id: 0
  # CSI camera tren xe qua nvarguscamerasrc. Neu pipeline CSI khong mo hoac
  # mo nhung khong tra frame, thu /dev/video0 mot lan va ghi ro backend tren UI.
  flip_method: 0
  allow_usb_fallback: true
  usb_index: 0
  startup_attempts: 15
  startup_delay_s: 0.10
  csi_open_attempts: 2
  csi_retry_delay_s: 0.50
  # Khoá auto-exposure/white-balance: đổi sáng giữa lúc chạy là rủi ro domain shift lớn nhất.
  lock_exposure: true

  # Sửa lens shading màu (ám đỏ ở viền ảnh). Hệ số nằm ở configs/shading.yaml,
  # sinh bằng: python tools/calib_shading.py --mode flatfield --source <video>
  # enabled: false -> passthrough, KHÔNG đoán hệ số khi chưa hiệu chuẩn.
  # PHẢI hiệu chuẩn lại nếu đổi camera, đổi ống kính hoặc đổi độ phân giải capture.
  shading:
    enabled: true
    file: configs/shading.yaml
    max_gain: 3.0
    # source   = sửa ngay tại camera -> MỌI thứ đọc từ cam đều sạch viền đỏ:
    #            bám vạch, preview, video ghi lại, VÀ ảnh dataset đi train.
    # pipeline = chỉ sửa trong vòng xử lý; ảnh/video ghi ra là ảnh THÔ.
    # Chọn 'source' thì không hiệu chuẩn lại shading từ video cũ được nữa —
    # muốn hiệu chuẩn lại phải quay flat-field mới.
    apply_at: source

pipeline:
  proc_width: 320          # ảnh xử lý được resize xuống cho nhanh
  proc_height: 240
  control_hz: 30           # vòng chính -> quyết định điểm FPS (cần >= 20)
  detect_hz: 10            # luồng detect chạy chậm hơn, kết quả được cache
  fps_window: 60           # số frame để tính FPS trung bình trượt

# Lai tay de thu du lieu. min_throttle bu nguong chet co/ESC: khi can vua ra
# khoi deadzone, lenh bat dau tu 0.12 va tang den 0.30. Hieu chuan tren xe da
# ke: tang min_throttle dan den khi banh vua quay, khong tang tuy tien.
manual:
  # Gioi han + expo + slew rate giu servo khong nhay toi chan co khi gat can.
  # Profile LOW-POWER: full stick chi gui 0.60, sau do driver con chan output
  # servo o +/-0.40. Khi nguon + co khi da qua bai test moi tang tung 0.05.
  max_steering: 0.60
  steering_expo: 0.45
  steering_slew_rate: 1.5  # don vi lenh / giay; 0 -> khong gioi han
  # Vung chet quanh vi tri giua cua can gat. Can gamepad hiem khi ve dung 0.
  deadzone: 0.08
  min_throttle: 0.12
  max_throttle: 0.30
  throttle_rise_rate: 1.2
  throttle_fall_rate: 4.0  # nha ga nhanh hon tang ga
  # So anh/giay luu khi bam GHI DATA trong giao dien tune.
  sample_hz: 10.0
  # LUU Y: `max_steering` di qua DUNG chuoi gioi han cua che do tu dong:
  #   max_steering x driver.steering_gain, roi clip o driver.steering_output_max
  # Nang max_steering len 1.0 ma khong noi driver.steering_output_max thi bo goc
  # chi tang tu 0.390 len 0.400 (do duoc) - gan nhu khong doi gi.
  test_throttle: 0.25
  record_video: true
  # MJPG dung CPU; 15 FPS giam tai Jetson nhung van du de doi chieu lai xe.
  video_fps: 15
  video_queue_size: 30
  # Anh JPEG duoc ghi o thread rieng (khong chan vong camera/dieu khien);
  # day roi thi bo mau thay vi lam khung cam khi the SD/eMMC cham.
  image_queue_size: 64

lane:
  # MỤC TIÊU BÁM: vạch ĐỨT ở CHÍNH GIỮA sa bàn (không phải viền lane).
  mode: color_center       # color_center | gray (gray = bản cũ, giữ để so sánh)

  # MÀU VẠCH GIỮA — đổi sa bàn thì đổi đúng dòng này, không sửa code:
  #   red   : sa bàn tập hiện tại (vạch đứt đỏ trên sàn sáng)
  #   white : sa bàn thi theo ĐB §3.2 ("lane màu tối, line trắng đứt khúc ở giữa")
  line_color: red
  # Bỏ trống -> dùng preset của line_color trong perception/lane.py.
  # Chỉ khai đè khi đã đo trên sa bàn thật:
  # hsv_low_1:  [0, 80, 70]
  # hsv_high_1: [10, 255, 255]
  # hsv_low_2:  [170, 80, 70]
  # hsv_high_2: [180, 255, 255]

  # ROI: chỉ lấy phần dưới ảnh (mặt đường ngay trước xe)
  roi_top: 0.55            # tỉ lệ chiều cao, tính từ trên xuống
  roi_bottom: 1.0
  # Bird's-eye warp: 4 điểm nguồn theo tỉ lệ (x, y) của ảnh proc
  # Warp làm các nét đứt ở xa to lên: band hợp lệ tăng 4.0/10 -> 7.5/10.
  warp_src: [[0.10, 1.00], [0.90, 1.00], [0.62, 0.58], [0.38, 0.58]]
  warp_dst_margin: 0.25

  # --- Bám vạch đứt theo dải ngang ---
  n_bands: 10              # số dải chia dọc ảnh warp
  band_min_pixels: 25      # dải ít pixel hơn ngưỡng này = đang ở khoảng trống giữa 2 nét
  min_bands: 2             # dưới ngưỡng này mới coi là MẤT VẠCH (min_pixels cũ không bao giờ kích hoạt)
  max_run_frac: 0.45       # cụm cột rộng hơn 45% ảnh = viền lane, không phải vạch đứt
  max_jump_frac: 0.35      # cụm cách vị trí dự đoán quá xa = bắt nhầm vật khác
  lookahead: 0.6           # điểm ngắm xa (0 = ngay trước xe, 1 = xa nhất trong ROI)
                           # Tự động kẹp về vùng THỰC SỰ nhìn thấy vạch — không
                           # ngoại suy đa thức ra ngoài dữ liệu.
  smooth_alpha: 0.6        # EMA cho cte, giảm giật
  # Khử nhiễu theo DIỆN TÍCH blob, KHÔNG dùng MORPH_OPEN (erode xoá vạch mảnh).
  # Bỏ trống -> lấy mặc định theo line_color: red=25, white=12.
  # PHẢI đo lại trên sa bàn thật — ngưỡng này phụ thuộc bề rộng vạch và proc_width.
  # min_blob_area: 25
  morph_close: 3           # nối lại một nét đứt bị rách đôi

  # --- Chỉ dùng khi mode: gray ---
  threshold_block: 31
  threshold_c: -12
  min_pixels: 60

stopline:
  roi_top: 0.72
  min_row_fill: 0.45       # % pixel sáng trên 1 hàng để coi là vạch ngang
  min_rows: 3

control:
  pid:
    kp: 0.60
    ki: 0.00               # baseline không dùng I: dễ windup ở cua gấp
    kd: 0.10
    out_limit: 1.0
  steer_max: 0.60
  # Trần lái RIÊNG cho khúc cua — cua sa bàn rất hẹp, cần bẻ gần hết lái.
  # Dùng trần này cho cả đoạn thẳng thì xe giật và dễ vượt lane.
  corner_steer_max: 0.60
  #
  # !! GÓC CUA RỘNG QUÁ THÌ ĐỌC ĐÂY — ba giới hạn NHÂN DỒN nhau: !!
  #   steer_max 0.60  ×  driver.steering_gain 0.65  =  0.390
  #   rồi còn bị chặn bởi driver.steering_output_max 0.40
  #   => servo chỉ dùng 39% tầm quay (xung 1207–1793 µs / dải 750–2250 µs)
  # Bánh KHÔNG THỂ bẻ gắt hơn cho tới khi nới `driver.steering_output_max`.
  # Nới bao nhiêu phải ĐO, không đoán — servo đâm vào chặn cơ khí sẽ stall/cháy:
  #   python3 tools/check_hardware.py --driver nvidia --calibrate-steering \
  #       --wheels-are-lifted
  # Đo xong đặt `driver.steering_output_min/max` = giá trị an toàn cuối cùng,
  # rồi nâng `corner_steer_max` (và `steer_max` nếu muốn) cho tới khi
  # steer_max × |steering_gain| >= steering_output_max.
  # Đánh lái sớm khi vào cua: error = (1-w)*cte + w*cte_lookahead.
  # w = 0 -> chỉ sửa khi đã lệch (hay bị cắt cua muộn). w cao -> vào cua sớm hơn.
  steer_lookahead_weight: 0.5

  # --- HAI MỨC GA: đoạn thẳng đi nhanh, vào cua bỏ ga ---
  # Sa bàn có cua rất hẹp -> không dùng một v_max chung cho cả vòng.
  v_straight: 0.30         # ga khi phía trước thẳng
  v_corner: 0.12           # ga khi đang trong cua
  # Hysteresis: vào cua ở ngưỡng cao, ra cua ở ngưỡng thấp. Một ngưỡng duy nhất
  # sẽ làm ga bật/tắt liên tục khi độ cong dao động quanh nó.
  # Đo trên raw_camera.avi: |curvature| p50=0.21, p75=0.39.
  # enter 0.25 -> khoảng 43% thời gian được coi là cua trên sa bàn này.
  curve_enter: 0.25
  curve_exit: 0.15
  # Lái feed-forward theo độ cong, cộng THẲNG vào đầu ra PID:
  #   steer = PID(sai_số) + curve_feedforward * curvature
  # PID chỉ sửa cái đã sai; feed-forward đánh lái ngay khi NHÌN THẤY đường cong.
  # Trên cua hẹp đây là khác biệt giữa bám được và cắt cua.
  curve_feedforward: 0.9
  corner_steer_gain: 1.6   # trong chế độ CUA nhân thêm vào lái để bẻ gần hết
  # Giới hạn tốc độ đổi ga: lên từ từ (bánh không trượt), xuống nhanh (thấy cua
  # là bỏ ga ngay).
  throttle_rise_rate: 0.8
  throttle_fall_rate: 3.0

  v_max: 0.35              # TRẦN an toàn tuyệt đối, không phải ga mục tiêu
  v_min: 0.10              # sàn
  slowdown: 0.12           # bỏ thêm ga theo |cte|
  reverse_throttle: -0.15  # dùng khi thoát kẹt
  driver:
    # Xe BTC/Waveshare co mot PCA9685 o 0x40. Dieu khien truc tiep de tranh
    # bien the NvidiaRacecar hai dia chi (0x40 + 0x60) giu motor sau exception.
    implementation: waveshare_single_pca
    i2c_address: 0x40
    # De trong de giu tan so mac dinh cua ServoKit/NvidiaRacecar (50 Hz).
    # Chi dat 60 sau khi da do/kiem chung ESC va servo cua dung xe.
    pwm_frequency:
    steering_channel: 0
    throttle_channel: 1
    # Vong UI gui 30 Hz. Neu mat lenh qua 0.8 s, watchdog tu ghi throttle=0.
    command_timeout_s: 0.8
    # Hai gioi han duoi nam NGAY TRUOC lenh PCA9685, nen UI/PID/FSM deu khong
    # the vuot qua. Voi range 750-2250 us, +/-0.40 tuong duong 1200-1800 us.
    # Day la profile tam thoi cho den khi do duoc bien trai/phai cua tung xe.
    steering_gain: -0.65
    steering_offset: 0.0     # bù lệch cơ khí servo - đo lại trên xe thật
    steering_output_min: -0.40
    steering_output_max: 0.40
    throttle_gain: 0.8
    pulse_width_range: [750, 2250]

signs:
  backend: stub            # stub | yolo   (stub = không cần model, dùng để dev offline)
  model_path: models/signs.engine
  input_size: 320
  conf_threshold: 0.55
  # Đèn xanh phải chắc chắn hơn hẳn: báo nhầm xanh = vượt đèn đỏ = HỦY LƯỢT
  conf_green: 0.80
  conf_red: 0.35           # thấp có chủ ý: thà dừng thừa còn hơn bỏ sót đỏ
  vote_k: 3                # cần k/n frame đồng thuận mới latch nhãn
  vote_n: 5
  # bbox chiếm >= tỉ lệ này của khung -> đủ gần để khoá quyết định
  lock_area_ratio: 0.020
  classes:
    - turn_left
    - turn_right
    - go_straight
    - no_left
    - no_right
    - no_straight
    - red_light
    - green_light
    - obstacle

fsm:
  turn_duration_s: 1.6     # thời gian giữ lệnh rẽ trước khi trả về bám lane
  turn_steer: 0.55
  stopline_trigger: 0.35   # distance <= ngưỡng này = "đã tới vạch"
  stop_hold_s: 0.3         # giữ dừng tối thiểu trước vạch khi đèn đỏ
  # Biển CẤM: ĐB §4.3 nói tại ngã tư đó "chỉ có hai hướng", nhưng không nói
  # hai hướng nào. Chưa khảo sát được sa bàn thật -> để cấu hình, CHỐT LẠI
  # sau buổi khảo sát sa bàn. Đây là giả định, không phải sự thật đã kiểm chứng.
  prohibit_fallback:
    no_left: straight
    no_right: straight
    no_straight: right
  # Phát hiện kẹt bằng chênh lệch ảnh liên tiếp (JetRacer không chắc có encoder).
  # PHẢI HIỆU CHUẨN TRÊN XE THẬT: cho xe đứng yên đo giá trị nhiễu nền, rồi cho
  # xe chạy chậm nhất đo giá trị thật; đặt ngưỡng vào giữa. Đặt sai -> hoặc báo
  # kẹt nhầm liên tục, hoặc không bao giờ phát hiện được kẹt.
  motion_threshold: 2.0
  stuck_timeout_s: 3.0     # tự thoát kẹt TRƯỚC mốc 10 s phải xin restart (ĐB §6)
  unstuck_duration_s: 0.8

logging:
  dir: logs
  flush_every: 30          # ghi xuống đĩa mỗi N dòng (mất điện đột ngột vẫn còn log)
