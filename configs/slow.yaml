# Ga thấp cho lượt chạy thử đầu tiên trên sa bàn thật.
# Dùng CHỒNG lên cnn.yaml:
#   --override configs/cnn.yaml --override configs/slow.yaml
# Chạy ổn rồi thì bỏ file này ra trước, giữ cnn.yaml.
control:
